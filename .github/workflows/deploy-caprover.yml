name: Deploy CapRover

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-restodici
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'restodici-backend/**'
            frontend:
              - 'restodici-frontend/**'

  backend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pack backend
        working-directory: restodici-backend
        run: |
          COPYFILE_DISABLE=1 tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./dist' \
            --exclude='./coverage' \
            --exclude='./caprover.env' \
            -cf "$GITHUB_WORKSPACE/deploy.tar" .

      - name: Deploy backend
        # caprover/deploy-from-github@v1.1.2 fait `npm i -g caprover` sans
        # version figée à chaque run. caprover@2.4.0 (publié le 2026-08-05)
        # a fait passer sa dépendance update-notifier de ^3.0.1 (CJS) à
        # ^7.3.1 (ESM-only), donc le require() du CLI plante immédiatement
        # (ERR_REQUIRE_ESM) — casse tous les déploiements en amont, sans
        # rapport avec nos secrets ni le serveur CapRover. On appelle donc
        # le CLI nous-mêmes, figé sur la dernière version saine connue.
        run: |
          npm install -g caprover@2.3.1
          caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_SERVER }}" \
            --appToken "${{ secrets.CAPROVER_BACKEND_APP_TOKEN }}" \
            --appName restodici-backend \
            --tarFile "$GITHUB_WORKSPACE/deploy.tar"

  frontend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pack frontend
        working-directory: restodici-frontend
        run: |
          COPYFILE_DISABLE=1 tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./dist' \
            --exclude='./.vite' \
            --exclude='./test-results' \
            --exclude='./e2e' \
            -cf "$GITHUB_WORKSPACE/deploy.tar" .

      - name: Deploy frontend
        # Voir le commentaire équivalent du job backend : on n'utilise plus
        # caprover/deploy-from-github@v1.1.2 (npm i -g caprover non figé,
        # cassé par caprover@2.4.0/update-notifier ESM), on fige nous-mêmes
        # la dernière version saine.
        run: |
          npm install -g caprover@2.3.1
          caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_SERVER }}" \
            --appToken "${{ secrets.CAPROVER_FRONTEND_APP_TOKEN }}" \
            --appName restodici-front \
            --tarFile "$GITHUB_WORKSPACE/deploy.tar"
