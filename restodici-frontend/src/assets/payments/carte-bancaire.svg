<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 56" width="160" height="56">
  <rect width="160" height="56" rx="12" fill="#1A1F2C"/>
  <!-- Visa logo text -->
  <text x="16" y="34" font-family="'Inter', Arial, sans-serif" font-size="16" font-style="italic" font-weight="900" fill="#0066CC" letter-spacing="1">VISA</text>
  <!-- Mastercard circles -->
  <circle cx="85" cy="28" r="12" fill="#EB001B"/>
  <circle cx="99" cy="28" r="12" fill="#F79E1B" fill-opacity="0.85"/>
  <!-- Card Label -->
