<!--
  logo-mark.svg — marque Resto d'ici telle qu'affichée dans l'en-tête de la
  page d'accueil : carré arrondi en dégradé orange, couverts croisés blancs.

  Sert de source unique au logo des emails transactionnels
  (restodici-backend/src/email/logo-asset.ts, régénéré via `npm run email:logo`).

  Le tracé des couverts reprend l'icône « utensils-crossed » de lucide-react
  (licence ISC), mise à l'échelle depuis sa grille d'origine de 24×24.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="markBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3A03"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Fond : rayon proportionnel à celui de l'accueil (14 px pour 42 px) -->
  <rect x="0" y="0" width="128" height="128" rx="43" fill="url(#markBg)"/>

  <!-- Couverts croisés : grille lucide 24×24 centrée et agrandie ×3,2 -->
  <g transform="translate(25.6, 25.6) scale(3.2)"
     fill="none" stroke="#FFFFFF" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"/>
    <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"/>
    <path d="m2.1 21.8 6.4-6.3"/>
    <path d="m19 5-7 7"/>
  </g>
</svg>
