<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Warm Orange Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Golden Highlight Gradient for accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with sleek border & shadow -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" />

  <!-- Restaurant Cloche & Cutlery Icon Concept -->
  <g transform="translate(0, -6)">
    <!-- Cloche handle dot -->
    <circle cx="256" cy="148" r="22" fill="url(#goldGrad)" />

    <!-- Cloche dome -->
    <path d="M 128 268 C 128 184, 184 172, 256 172 C 328 172, 384 184, 384 268 Z" fill="#FFFFFF" opacity="0.96" />
    <path d="M 128 268 C 128 184, 184 172, 256 172 Z" fill="#FFFFFF" opacity="0.15" />

    <!-- Cloche Base Plate -->
    <rect x="104" y="278" width="304" height="24" rx="12" fill="url(#goldGrad)" />

    <!-- Fork & Knife crossed accent underneath plate -->
    <!-- Fork left -->
    <path d="M 160 336 L 160 380 Q 160 400 180 400 L 180 336" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <line x1="170" y1="336" x2="170" y2="424" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

    <!-- Knife right -->
    <path d="M 330 336 Q 352 350 352 380 L 330 380 Z" fill="#FFFFFF" />
    <line x1="335" y1="336" x2="335" y2="424" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Sparkle Accent -->
  <path d="M 390 120 Q 405 135 420 120 Q 405 105 390 120 Z" fill="url(#goldGrad)" />
</svg>